; M5stack Cardputer Advanced
[env:m5stack-cardputer-adv]
extends = esp32s3_base
board_level = release
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_flags = 
  ${esp32s3_base.build_flags}
  -D M5STACK_CARDPUTER_ADV
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_cardputer_adv
  -DOLEDDISPLAY_REDUCE_MEMORY
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.1.zip
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

; M5stack Cardputer Advanced, LVGL UI (device-ui) instead of the legacy screen.
; Experimental: device-ui has no view for this panel's 240x135 and its TCA8418
; keyboard driver is a stub, so the UI is cropped and the keys are dead. See the
; PR description before promoting this above board_level = extra.
[env:m5stack-cardputer-adv-tft]
extends = env:m5stack-cardputer-adv
board_level = extra
board_build.partitions = partition-table-8MB.csv

build_flags =
  ${env:m5stack-cardputer-adv.build_flags}
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D RAM_SIZE=96
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_SPI_PARANOID=0
  ; Panel description for device-ui's runtime-configurable LovyanGFX driver.
  ; Values mirror M5GFX's board_M5CardputerADV: a 1.14" ST7789 whose 135x240
  ; glass sits at offset 52/40 in the controller's 240x320 memory, turned to
  ; landscape. Pins and host match variant.h - the panel stays on SPI2_HOST
  ; because the SX1262 owns HSPI/SPI3_HOST (SPI1 in main.cpp) on the S3.
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D LGFX_PANEL=ST7789
  -D LGFX_CFG_HOST=SPI2_HOST
  -D LGFX_PIN_SCK=36
  -D LGFX_PIN_MOSI=35
  -D LGFX_PIN_MISO=-1
  -D LGFX_PIN_DC=34
  -D LGFX_PIN_CS=37
  -D LGFX_PIN_RST=33
  -D LGFX_PIN_BL=38
  -D LGFX_SCREEN_WIDTH=135
  -D LGFX_SCREEN_HEIGHT=240
  -D LGFX_OFFSET_X=52
  -D LGFX_OFFSET_Y=40
  -D LGFX_ROTATION=1
  -D LGFX_INVERT_COLOR=true
  ; no MISO line to the panel, so readback is not possible
  -D LGFX_READABLE=false
  -D DISPLAY_SIZE=240x135
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW

lib_deps =
  ${env:m5stack-cardputer-adv.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
  ${device-ui_base.lib_deps}

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
